[package]
name = "yekonga"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Rust port of the Yekonga server framework: schema-driven REST, GraphQL, sockets and cloud functions"
license-file = "../GO/LICENSE"
publish = false

[features]
default = ["mongodb", "mysql"]
# The MongoDB backend (`database.kind: "mongodb"`).
mongodb = ["dep:mongodb"]
# The MySQL backend (`database.kind: "mysql"` or `"sql"`).
mysql = ["dep:mysql_async"]

[dependencies]
async-graphql = { version = "7", default-features = false, features = ["dynamic-schema"] }
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
base64 = "0.22"
bcrypt = "0.19"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hmac = "0.12"
http = "1"
mime_guess = "2"
multer = { version = "3", default-features = false }
mongodb = { version = "3", optional = true }
mysql_async = { version = "0.36", optional = true, default-features = false, features = ["minimal"] }
percent-encoding = "2"
rand = "0.9"
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-gzip", "fs"] }
tracing = "0.1"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-tungstenite = "0.24"
